# The repository root is mounted as the plugin directory, so its tooling would otherwise be served.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/wp-content/plugins/alondra/(\.[^/]+|dev|docker|scripts|tests|tests-e2e|release|node_modules)(/|$)">
    Require all denied
</DirectoryMatch>
# vendor/ also holds the dev tools; only the Freemius SDK ships assets the browser loads.
<DirectoryMatch "^/var/www/html/wp-content/plugins/alondra/vendor/(?!freemius(/|$))[^/]+(/|$)">
    Require all denied
</DirectoryMatch>
