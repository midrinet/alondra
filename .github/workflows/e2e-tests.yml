name: E2E tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, ready_for_review]
    paths:
      - '**.php'
      - 'composer.lock'
      - 'assets/**'
      - 'webpack.config.js'
      - 'package-lock.json'
      - 'tests-e2e/**'
      - 'playwright.config.js'
      # Provisioning. The suite only ever sees the store scripts/setup leaves behind, and the
      # entrypoint and the demo product images are baked into the dev image, so docker/ is code
      # under test. dev/demo-theme is the markup the frontend specs read prices from, and
      # dev/helper carries the webhooks the fixtures call and the demo catalog seeder.
      - 'docker/**'
      - 'compose.yml'
      - '.env.sample'
      - 'scripts/**'
      - 'dev/**'
      - '.github/workflows/e2e-tests.yml'

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  composer:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        id: composer-cache
        with:
          path: |
            vendor
            dev/helper/vendor
          key: alondra-e2e-composer-cache-v1-${{ hashFiles('composer.lock', 'dev/helper/composer.lock', 'src/**/*.php', 'dev/helper/src/**/*.php') }}

      - name: Composer install
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          scripts/composer install --quiet --no-interaction --working-dir=.
          scripts/composer install --no-dev --quiet --no-interaction --working-dir=dev/helper

  node:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/cache@v5
        id: pnpm-cache
        with:
          path: node_modules
          key: alondra-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --silent

      - uses: actions/cache@v5
        id: assets-cache
        with:
          path: assets
          key: alondra-assets-cache-${{ hashFiles('pnpm-lock.yaml', 'webpack.config.js', 'assets/index.php', 'assets/js/**/*.js', 'assets/css/**/*.scss') }}

      - name: Build Assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        run: pnpm run build --silent

      - uses: actions/cache@v5
        id: playwright-browser-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browser-cache-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium-headless-shell --with-deps

  e2e-tests-local:
    needs: [composer, node]
    runs-on: ubuntu-latest
    # 8 for provisioning and the suite, plus ~4 for the image build.
    timeout-minutes: 13
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    strategy:
      # A catalog change tends to break more than one leg at once: without this the first
      # failure cancels the rest and the report names one suite out of however many broke.
      fail-fast: false
      matrix:
        # Every leg is a runner of its own, with its own containers and volumes, so nothing a
        # suite does to the seeded store can reach another. 003 is the plugin's uninstall
        # coverage: "uninstalling removes the plugin's data" is a promise to wordpress.org users
        # and something plugin reviewers check. 002 is the settings page: the PATCH save, the
        # mixed-field rule and the banner.
        suite: ['001', '002', '003', '005']
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR's merge commit and its base, to tell whether it changes docker/.
          fetch-depth: 2

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Use vendor cache
        uses: actions/cache@v5
        with:
          path: |
            vendor
            dev/helper/vendor
          key: alondra-e2e-composer-cache-v1-${{ hashFiles('composer.lock', 'dev/helper/composer.lock', 'src/**/*.php', 'dev/helper/src/**/*.php') }}

      - name: Use node_modules cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: alondra-pnpm-cache-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Use assets cache
        uses: actions/cache@v5
        with:
          path: assets
          key: alondra-assets-cache-${{ hashFiles('pnpm-lock.yaml', 'webpack.config.js', 'assets/index.php', 'assets/js/**/*.js', 'assets/css/**/*.scss') }}

      - name: Use Playwright browser cache
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-browser-cache-${{ hashFiles('pnpm-lock.yaml') }}

      # Not redistributable, so not tracked: scripts/publish-product-bundles pushes it as a
      # scratch image tagged with PB_VERSION from .env.sample.
      - name: Fetch the Product Bundles zip
        run: |
          PB_VERSION=$(sed -n 's/^PB_VERSION=//p' .env.sample)
          mkdir -p docker/plugins
          docker create --name pb "ghcr.io/${{ github.repository_owner }}/woocommerce-product-bundles:$PB_VERSION" none
          docker cp "pb:/woocommerce-product-bundles-$PB_VERSION.zip" docker/plugins/
          docker rm pb

      - name: Setup the environment
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cp .env.sample .env
          # A published <wp>-<php> tag carries the provisioning of the commit that published it.
          # A PR that changes docker/ builds its own, so docker/** above is not a lie, as do a
          # manual run and a tag not published yet; scripts/setup prefers a local tag over the
          # registry. Any other PR pulls the tag, so it does not depend on the image's upstream
          # sources (PECL, Docker Hub) being up.
          . ./.env
          image="$CONTAINER_REGISTRY/$CONTAINER_REGISTRY_USER/alondra:$WP_VERSION-$PHP_VERSION"
          if [ "$EVENT" = pull_request ] && git diff --quiet HEAD^ HEAD -- docker/ && docker pull -q "$image"; then
            echo "Pulled $image"
          else
            docker/build-image.sh
          fi
          scripts/setup

      - name: Run E2E tests
        run: scripts/playwright ${{ matrix.suite }}

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color > /tmp/container-logs.txt

      - name: DB dump on failure
        if: failure()
        run: docker compose exec -T web-alondra wp db export - --allow-root > /tmp/db-dump.sql

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            /tmp/test-results
            /tmp/container-logs.txt
            /tmp/db-dump.sql
          retention-days: 3

      - name: Cleanup
        if: always()
        run: scripts/teardown
